interface:
  display_name: "Allegory Teach"
  short_description: "Teach one advanced concept through a causal fable and worked example."
  default_prompt: "Use $allegory-teach to explain one profile-relevant concept as a causal fable, map its logic chain back to facts, and work one complete example in the form best suited to the concept."

policy:
  allow_implicit_invocation: true
